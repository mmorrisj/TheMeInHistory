# The shared tag vocabulary that character traits are normalised into.
#
# Era Packs map these tags to era-specific affordances. A tag with no mapping in
# a given pack is not an error: it means the era has no equivalent, and the
# player is told so honestly rather than being handed a false one.

skills:
