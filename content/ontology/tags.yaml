    label: Medicine and healing
    aliases: [doctor, nurse, first aid, emt, paramedic, healthcare, surgery, pharmacology]
  - id: skill.chemistry
    label: Chemistry
    aliases: [chemist, biochemistry, lab work, pharmacy]
