id: virginia-colony-1607
title: "Virginia Colony: Jamestown, 1607-1624"
blurb: >-
  Three ships anchor in a brackish river on the edge of a country that already
  has a name, a paramount chief, and thirty years of memory of Europeans. You
  arrive in the middle of the worst drought in seven centuries, into a colony
  run by a council that cannot stop quarrelling, in a land the Powhatan call
  Tsenacommacah. Most of the people who land with you will be dead within a
  year.
status: reviewed

review:
  level: automated
  by: "Claude Code — automated source-verification pass"
  date: "2026-08-24"
  scope: >-
    Cross-file referential integrity, sourcing discipline, and a spot-check of
    the pack's load-bearing dates, figures, and attributions against published
    scholarship and institutional history reachable from this environment.
    Coverage is the pivotal and contested entries plus every claim carrying a
    specific number or date, not all 42 events line by line.
  spot_checks:
    - claim: "Site chosen and Wingfield elected president 13 May 1607; unloading began 14 May"
      against: "Britannica, Jamestown Colony; Encyclopedia Virginia, Early Jamestown Settlement"
      result: confirmed
    - claim: "Second Supply landed the first two Englishwomen, October 1608"
      against: "Contemporary accounts via Jamestown institutional histories; one source gives 30 September"
      result: confirmed
      detail: >-
        Sources cluster on 1 October 1608, with a minority giving 30 September.
        The pack's month-level date "1608-10" is inside the evidence either way.
    - claim: "Gates reached Jamestown 24 May 1610 and found about 60 alive of roughly 240"
      against: "Encyclopedia Virginia, Sir Thomas Gates; Jamestown institutional histories"
      result: confirmed
      detail: >-
        Gates anchored at Point Comfort on 21 May and reached Jamestown on 24
        May. The pack dates the Jamestown arrival, which is the one the story
        turns on.
    - claim: "Colony abandoned 7 June 1610; De La Warr's advance boat met them 8 June at Mulberry Island"
      against: "Encyclopedia Virginia, Thomas West, twelfth Baron De La Warr"
      result: confirmed
      detail: >-
        De La Warr himself reached Jamestown on 10 June. The pack's 8 June event
        is the interception, which is the correct date for that beat.
    - claim: "1606-1612 was the driest seven-year period in 770 years"
      against: "Stahle et al., Science 280:5363 (1998), 564-567"
      result: confirmed
    - claim: "347 English killed on 22 March 1622, about a quarter of the colony"
      against: "Virginia Company list of the dead, via Encyclopedia Virginia and Jamestown-Yorktown Foundation"
      result: confirmed
      detail: "347 of a population of roughly 1,250."
    - claim: "First General Assembly met 30 July 1619 in the church at Jamestown"
      against: "Encyclopedia Virginia, The General Assembly Convenes (1619)"
      result: confirmed
    - claim: "August 1619 arrivals came via the White Lion from the Sao Joao Bautista, out of Ndongo"
      against: "Sluiter (WMQ 1997) and Thornton (WMQ 1998) as summarised by NPS and Hampton, VA"
      result: confirmed
    - claim: "Jamestown was warned in 1622 by a Powhatan youth named Chanco"
      against: "Encyclopedia Virginia, Chauco (fl. 1622-1623); Rountree"
      result: corrected
      detail: >-
        The 1622 Company account names no one. The name enters in a 1623 council
        letter as "Chauco"/"Chavco", was misread as "Chanco" by William Stith in
        1740, and Rountree holds that Chauco and Pace's unnamed warner may be
        different people. The timeline entry asserted the name as established
        fact, contradicting the pack's own people.yaml entry. Corrected in this
        pass: the summary no longer names him and the note carries the dispute.
    - claim: "Pocahontas rescue is contested between Smith's 1608 and 1624 accounts"
      against: "Smith, A True Relation (1608) vs Generall Historie (1624); Rountree (2005)"
      result: confirmed
  limitations: >-
    This pass establishes that the pack's checkable assertions match published
    scholarship and that its internal references resolve. It does not establish
    that the pack's framing, emphasis, proportion, or omissions are sound, and
    those are where a history for learners most often goes wrong. In particular
    it has not been assessed by anyone with standing in Powhatan history for how
    it represents Tsenacommacah, which is the judgement this pack most needs and
    least has. Treat `level: automated` as "not yet expert-reviewed".

date_range:
  start: "1607-04-26"
  end: "1624-05-24"

regions:
  - james-river
  - york-river
  - chesapeake-bay
  - atlantic-crossing
  - london

social_positions:
  - id: gentleman
    label: Gentleman Adventurer
    description: >-
      A younger son or minor gentry with a share in the Virginia Company. You
      came for profit and reputation, not labour, and roughly a third of the
      first landing party is like you. You carry a sword and expect to be
      addressed as Master.
    constraints:
      - "Manual labour is beneath your station, and saying so out loud in 1607 is normal, not villainous."
      - "You answer to the Council, and the Council answers to London seven weeks away by sea."
      - "Your survival depends on people you consider your inferiors."

  - id: artisan
    label: Craftsman or Artisan
    description: >-
      A carpenter, blacksmith, bricklayer, cooper, or one of the Polish and
      German glassmakers and pitch-burners brought over in 1608. Your skills are
      the colony's actual capital, and everyone knows it but the gentlemen.
    constraints:
      - "You work for the Company, not for wages. There is no market to sell your labour into."
      - "You may be the only person in the colony who can do what you do, which is both leverage and a trap."
      - "Foreign-born artisans are outside the English chain of command and often outside its protection."

  - id: labourer
    label: Labourer or Servant
    description: >-
      Bound to the Company by indenture, or simply too poor to have been asked.
      You dig, carry, cut, and are the first to be sent outside the palisade.
    constraints:
      - "Your indenture is a legal instrument, and running to the Powhatan is punished as desertion."
      - "You eat what the common store issues, when it issues it."
      - "Under Dale's martial law after 1611 the penalties available for your disobedience include death."

  - id: soldier
    label: Soldier
    description: >-
      A veteran of the Low Countries or the Irish wars, hired for defence. Your
      trade is the one skill the colony never stops needing.
    constraints:
      - "You are expected to fire on people whose land this is, and to call it defence."
      - "Your matchlock takes the better part of a minute to load and will not fire in the wet."
      - "You take orders from gentlemen who have never held a pike."

  - id: woman-settler
    label: Englishwoman in the Colony
    description: >-
      Almost nobody, at first. Mistress Forrest and her maid Anne Burras arrive
      in autumn 1608 as the only two women among two hundred men; large-scale
      transport of women does not begin until 1620.
    constraints:
      - "You have no legal standing independent of a husband or master."
      - "Your scarcity makes you both valuable and unsafe, and the record of what that meant is thin because nobody thought to write it down."
      - "The work assigned to you is unending and invisible in every account written by men."

content_posture:
  unavoidable:
    - "The dispossession of the Powhatan peoples from land they had farmed for centuries."
    - "Massacre and reprisal in both directions, including the deliberate English killing of non-combatants."
    - "Starvation severe enough to produce documented cannibalism."
    - "The arrival in 1619 of the first documented Africans in English North America, taken by force from Ndongo."
    - "Indentured servitude enforced by corporal and capital punishment."
  depicts:
    - "Hunger, illness, and death from disease, in plain terms."
    - "The aftermath of violence, and its cost to the people who committed it."
    - "Period contempt in the mouths of period characters, where the story is about that contempt."
    - "Powhatan life on its own terms, not as backdrop to an English story."
  reports:
    - "Sexual violence: acknowledged as part of the historical record, never rendered as a scene."
    - "The killing of children at Paspahegh in 1610: reported in its full horror, not staged."
    - "Torture and execution under martial law."
  refuses:
    - "Any framing in which colonisation is adventure without cost to the colonised."
    - "Depiction of enslaved or captive people as content with their condition."
    - "Gore or suffering rendered for effect rather than for understanding."
  fixed_outcomes:
    - "The Powhatan lose their land. No player choice reverses this."
    - "The Starving Time kills the great majority of the colony in the winter of 1609-10."
    - "Africans are landed at Point Comfort in August 1619 and are not free to leave."
    - "Opechancanough's coordinated attack falls on 22 March 1622."
    - "The colony survives. It is not abandoned, though in June 1610 it very nearly is."
