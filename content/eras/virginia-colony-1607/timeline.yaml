  - id: pocahontas-dies
    date: "1617-03"
    title: Pocahontas Dies at Gravesend
    summary: >-
      Taken to England in 1616 and displayed as evidence that the Virginia
      project could civilise and convert, she falls ill as her ship prepares to
      sail home and dies at Gravesend, aged about twenty-one. Her son Thomas is
      left behind in England.
