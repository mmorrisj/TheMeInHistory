  - id: powhatan-dies
    date: "1618-04"
    title: Wahunsenacawh Dies
    summary: >-
      The paramount chief who built Tsenacommacah from six inherited districts
      into a confederation of some thirty dies in the spring of 1618. His
      brother Opitchapam succeeds him nominally; the real authority passes to
      Opechancanough, who has never believed the English could be lived with.
