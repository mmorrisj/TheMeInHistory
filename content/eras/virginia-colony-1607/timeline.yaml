  - id: great-charter-headright
    date: "1618-11"
    title: The Great Charter and the Headright System
    summary: >-
      The Company grants fifty acres to anyone who pays his own passage, and
      fifty more for every additional person he transports. Land in Virginia
      becomes a function of how many bodies a man can move across the Atlantic.
      The system that will fill the colony with indentured servants, and later
      with enslaved people, is written down here as an incentive scheme.
    region: london
    people: [edwin-sandys]
    places: []
    fixed: true
    significance: pivotal
    tags: [land, labour, company, policy]
    certainty: established
    source_ids: [virginia-company-records, horn-1619-2018]

  - id: first-assembly
    date: "1619-07-30"
    title: The First General Assembly
    summary: >-
      Twenty-two burgesses, two from each of eleven settlements, meet with the
      governor and council in the choir of the church at Jamestown. It is the
      first representative assembly in English America. They sit for five days
      in August heat, one member dies of the sickness, and they legislate on
      tobacco prices, drunkenness, idleness, and the instruction of Powhatan
      children in English religion.
    region: james-river
    people: [george-yeardley, john-pory]
    places: [james-fort, jamestown-church]
    fixed: true
    significance: pivotal
    tags: [government, representation, law]
    certainty: established
    source_ids: [assembly-proceedings-1619, horn-1619-2018]

  - id: first-africans-arrive
    date: "1619-08"
    title: The White Lion at Point Comfort
    summary: >-
      An English privateer sailing under a Dutch letter of marque puts in at
      Point Comfort with, in John Rolfe's words, "20. and odd Negroes," which
      the governor and cape merchant buy for provisions. They had been taken
      from the Portuguese slave ship Sao Joao Bautista, bound from Luanda to
      Vera Cruz, and they came from the kingdom of Ndongo in West Central
      Africa. The Treasurer arrives days later with more. These are the first
      documented Africans in English North America.
    region: james-river
    people: [john-rolfe, george-yeardley]
    places: [point-comfort, james-fort]
    fixed: true
    significance: pivotal
    tags: [slavery, africa, labour, arrival]
    certainty: established
    note: >-
      What is established: who they were, where they were taken from, how they
      arrived, and that they were exchanged for provisions. What is contested:
      their precise legal status in a colony that had not yet written slavery
      into law. Some were later recorded holding property and one, Anthony
      Johnson, land and servants of his own. Virginia's statutory slavery comes
      decades later. Do not resolve this into either "they were slaves" or "they
      were indentured servants" — the ambiguity is the historical finding, and
      it never made them free to leave.
    source_ids: [rolfe-letter-1619, sluiter-20-and-odd-1997, thornton-african-experience-1998, horn-1619-2018]

  - id: maids-for-wives
    date: "1620"
    end_date: "1621"
    title: The Company Ships Women
    summary: >-
      The Virginia Company transports some ninety women as prospective wives,
      their passage to be repaid by any planter who marries one, at 120 pounds
      of best leaf tobacco. The Company is explicit that a colony of men without
      families will not hold. A woman's transport is priced in the crop.
    region: james-river
    people: [edwin-sandys]
    places: [james-fort]
    fixed: true
    significance: major
    tags: [women, society, tobacco, company]
    certainty: established
    source_ids: [virginia-company-records, horn-1619-2018]

  - id: powhatan-uprising-1622
    date: "1622-03-22"
    title: The Rising of 1622
    summary: >-
      Opechancanough launches a coordinated assault along both banks of the
      James at once. Warriors enter the scattered plantations unarmed, as they
      had done daily for eight years of peace, sat to breakfast, then took up
      whatever tools were to hand. About 347 English die in a morning, roughly a
      quarter of the colony. Jamestown itself is warned in the night by a
      Powhatan living in an English household, and holds. It
      is the answer to eight years of plantations spreading up the river, and
      the English use it as licence for a war of extermination.
    region: james-river
    people: [opechancanough, john-rolfe]
    places: [james-fort, henrico, martins-hundred]
    fixed: true
    significance: pivotal
    tags: [violence, war, uprising]
    certainty: established
    note: >-
      The casualty figure of 347 comes from a Company list of the dead and is
      about as firm as any number in this pack. The warning to Jamestown is
      attested; the name is not. The 1622 Company account names no one, the name
      enters a 1623 council letter as "Chauco", William Stith misread it as
      "Chanco" in 1740, and Rountree holds that Chauco and the man who warned
      Richard Pace may be two different people. Several Powhatan appear to have
      warned colonists. Narrate the warning, do not assert the name, and do not
      let one man's choice stand in for a people's.
    source_ids: [virginia-company-records, smith-generall-historie-1624, rountree-powhatan-1989, ev-chauco]

  - id: charter-revoked
    date: "1624-05-24"
    title: The Company Dissolved
    summary: >-
      After a royal commission into the colony's mortality — some six thousand
      people sent since 1607, and about twelve hundred alive — James I revokes
      the charter. Virginia becomes a royal colony. The joint-stock experiment
      is over; the tobacco plantations, the headright system and the assembly it
      created all remain.
    region: london
    people: [edwin-sandys]
    places: []
    fixed: true
    significance: pivotal
    tags: [company, politics, end]
    certainty: established
    source_ids: [virginia-company-records, horn-land-as-god-made-it-2005]
